[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ob-hyp-candidate"
version = "0.1.0rc1"
description = "Portable local OB bucket and Hyp original-text memory candidate"
requires-python = ">=3.11"
dependencies = ["python-frontmatter==1.3.0", "PyYAML==6.0.3", "rapidfuzz==3.14.6", "jieba==0.42.1"]

[project.optional-dependencies]
mcp = ["mcp==1.30.0"]

[project.scripts]
ob-hyp = "ob_hyp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
